<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Bắn Súng</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 14px;
            color: #888;
            z-index: 10;
            pointer-events: none;
        }
        #select-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            background-color: rgba(0, 0, 0, 0.9);
        }
        #select-screen h2 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        .btn-group {
            display: flex;
            gap: 15px;
        }
        .btn {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: #fff;
        }
        .btn-mobile { background-color: #0088cc; }
        .btn-pc { background-color: #4cae4c; }
        canvas { display: block; }
    </style>
</head>
<body>

    <div id="info">
        Máu: <span id="hp">100</span><br>
        Điểm: <span id="score">0</span><br>
        Chế độ: <span id="mode">Chưa chọn</span>
    </div>

    <div id="select-screen">
        <h2>Bạn đang chơi trên thiết bị nào?</h2>
        <div class="btn-group">
            <button class="btn btn-mobile" onclick="selectDevice('mobile')">📱 Điện thoại</button>
            <button class="btn btn-pc" onclick="selectDevice('pc')">💻 Máy tính</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let myPlayer = { x: canvas.width / 2, y: canvas.height / 2, hp: 100, score: 0 };
        let otherPlayers = {};
        let deviceMode = '';

        function selectDevice(mode) {
            deviceMode = mode;
            document.getElementById('mode').innerText = mode === 'mobile' ? 'Điện thoại' : 'Máy tính';
            document.getElementById('select-screen').style.display = 'none';
        }

        // --- SOCKET.IO MULTIPLAYER ---
        socket.on('currentPlayers', (players) => {
            otherPlayers = players;
        });

        socket.on('newPlayer', (data) => {
            otherPlayers[data.id] = data.player;
        });

        socket.on('playerMoved', (data) => {
            if (otherPlayers[data.id]) {
                otherPlayers[data.id].x = data.x;
                otherPlayers[data.id].y = data.y;
            }
        });

        socket.on('disconnectPlayer', (id) => {
            delete otherPlayers[id];
        });

        // Di chuyển bằng phím cho PC
        window.addEventListener('keydown', (e) => {
            let speed = 6;
            if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') myPlayer.y -= speed;
            if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') myPlayer.y += speed;
            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') myPlayer.x -= speed;
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') myPlayer.x += speed;

            socket.emit('playerMovement', { x: myPlayer.x, y: myPlayer.y });
        });

        // Game Loop
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Vẽ những người chơi khác
            Object.keys(otherPlayers).forEach((id) => {
                let p = otherPlayers[id];
                ctx.fillStyle = p.color || '#ff5722';
                ctx.beginPath();
                ctx.arc(p.x, p.y, 15, 0, Math.PI * 2);
                ctx.fill();
            });

            // Vẽ bản thân
            ctx.fillStyle = '#4CAF50';
            ctx.beginPath();
            ctx.arc(myPlayer.x, myPlayer.y, 15, 0, Math.PI * 2);
            ctx.fill();

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
