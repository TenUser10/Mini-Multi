<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-Multi Shooter Game</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        canvas {
            background-color: #222;
            border: 2px solid #555;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <h1>Mini-Multi Shooter 🎮</h1>
    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <!-- Thư viện Socket.io client -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Thông tin người chơi của mình
        let myPosition = { x: 100, y: 100 };
        let otherPlayers = {};
        let bullets = [];

        // Lắng nghe danh sách người chơi ban đầu
        socket.on('currentPlayers', (players) => {
            otherPlayers = players;
            if (players[socket.id]) {
                myPosition.x = players[socket.id].x;
                myPosition.y = players[socket.id].y;
            }
        });

        // Người chơi mới tham gia
        socket.on('newPlayer', (data) => {
            otherPlayers[data.id] = data.player;
        });

        // Cập nhật khi người chơi khác di chuyển
        socket.on('playerMoved', (data) => {
            if (otherPlayers[data]) {
                // cập nhật vị trí
            }
            if (otherPlayers[data.id]) {
                otherPlayers[data.id].x = data.x;
                otherPlayers[data.id].y = data.y;
            }
        });

        // Xóa người chơi khi thoát
        socket.on('disconnectPlayer', (id) => {
            delete otherPlayers[id];
        });

        // Lắng nghe đạn bắn
        socket.on('bulletFired', (data) => {
            bullets.push(data);
        });

        // Điều khiển di chuyển bằng phím W, A, S, D
        window.addEventListener('keydown', (e) => {
            let speed = 5;
            if (e.key === 'w' || e.key === 'W') myPosition.y -= speed;
            if (e.key === 's' || e.key === 'S') myPosition.y += speed;
            if (e.key === 'a' || e.key === 'A') myPosition.x -= speed;
            if (e.key === 'd' || e.key === 'D') myPosition.x += speed;

            // Gửi tọa độ mới lên server
            socket.emit('playerMovement', { x: myPosition.x, y: myPosition.y });
        });

        // Vòng lặp vẽ game (Game Loop)
        function gameLoop() {
            // Xóa màn hình canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Vẽ tất cả người chơi khác
            Object.keys(otherPlayers).forEach((id) => {
                let p = otherPlayers[id];
                ctx.fillStyle = p.color || '#ff5722';
                ctx.beginPath();
                ctx.arc(p.x, p.y, 15, 0, Math.PI * 2);
                ctx.fill();
                
                // Vẽ tên hoặc ID ngắn của người chơi
                ctx.fillStyle = '#fff';
                ctx.font = '12px Arial';
                ctx.fillText(id.substring(0, 4), p.x - 12, p.y - 20);
            });

            // Vẽ bản thân mình
            ctx.fillStyle = '#4CAF50';
            ctx.beginPath();
            ctx.arc(myPosition.x, myPosition.y, 15, 0, Math.PI * 2);
            ctx.fill();

            requestAnimationFrame(gameLoop);
        }

        // Khởi chạy vòng lặp game
        gameLoop();
    </script>
</body>
</html>
