<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mini-Multi Shooter Game</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
        }
        canvas {
            display: block;
            background: #111;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            pointer-events: none;
        }
        #menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #111;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #333;
        }
        #menu input {
            margin: 10px 0;
            padding: 8px;
            width: 180px;
            background: #222;
            color: #fff;
            border: 1px solid #444;
        }
        #menu button {
            padding: 8px 16px;
            background: #00ff00;
            color: #000;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="menu">
        <h2>Mini-Multi</h2>
        <div>
            <label>Tên nhân vật:</label><br>
            <input type="text" id="playerName" value="TenUser10">
        </div>
        <div>
            <label>Màu sắc:</label><br>
            <input type="color" id="playerColor" value="#00ff00" style="width: 60px; height: 30px; padding: 0; border: none; background: none;">
        </div>
        <br>
        <button onclick="startGame()">VÀO GAME</button>
    </div>

    <div id="ui" style="display: none;">
        <div>Máu: 100</div>
        <div>Điểm: 0</div>
        <div>Chế độ: Máy tính</div>
    </div>
    <canvas id="gameCanvas" style="display: none;"></canvas>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const player = {
            x: 0,
            y: 0,
            radius: 15,
            color: '#00ff00',
            speed: 4,
            name: 'TenUser10'
        };

        const keys = {};

        window.addEventListener('keydown', (e) => keys[e.key] = true);
        window.addEventListener('keyup', (e) => keys[e.key] = false);

        function startGame() {
            const nameInput = document.getElementById('playerName').value;
            const colorInput = document.getElementById('playerColor').value;

            if (nameInput.trim() !== "") {
                player.name = nameInput;
            }
            player.color = colorInput;

            document.getElementById('menu').style.display = 'none';
            document.getElementById('ui').style.display = 'block';
            canvas.style.display = 'block';

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            player.x = canvas.width / 2;
            player.y = canvas.height / 2;

            loop();
        }

        function update() {
            if (keys['w'] || keys['W'] || keys['ArrowUp']) player.y -= player.speed;
            if (keys['s'] || keys['S'] || keys['ArrowDown']) player.y += player.speed;
            if (keys['a'] || keys['A'] || keys['ArrowLeft']) player.x -= player.speed;
            if (keys['d'] || keys['D'] || keys['ArrowRight']) player.x += player.speed;

            socket.emit('player-move', { x: player.x, y: player.y, name: player.name, color: player.color });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = player.color;
            ctx.fill();
            ctx.closePath();

            ctx.fillStyle = '#ffffff';
            ctx.font = '14px sans-serif';
            ctx.fillText(player.name, player.x - 20, player.y - 25);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
