<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Bắn Súng</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 14px;
            color: #888;
            z-index: 10;
            pointer-events: none;
        }
        #select-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            background-color: rgba(0, 0, 0, 0.9);
        }
        #select-screen h2 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        .btn-group {
            display: flex;
            gap: 15px;
        }
        .btn {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: #fff;
        }
        .btn-mobile { background-color: #0088cc; }
        .btn-pc { background-color: #4cae4c; }
        canvas { display: block; }
    </style>
</head>
<body>

    <div id="info">
        Máu: <span id="hp">100</span><br>
        Điểm: <span id="score">0</span><br>
        Chế độ: <span id="mode">Chưa chọn</span>
    </div>

    <div id="select-screen">
        <h2>Bạn đang chơi trên thiết bị nào?</h2>
        <div class="btn-group">
            <button class="btn btn-mobile" onclick="selectDevice('mobile')">📱 Điện thoại</button>
            <button class="btn btn-pc" onclick="selectDevice('pc')">💻 Máy tính</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let myPlayer = { x: canvas.width / 2, y: canvas.height / 2, hp: 100, score: 0, angle: 0 };
        let otherPlayers = {};
        let bullets = [];
        let mouseX = 0, mouseY = 0;

        function selectDevice(mode) {
            document.getElementById('mode').innerText = mode === 'mobile' ? 'Điện thoại' : 'Máy tính';
            document.getElementById('select-screen').style.display = 'none';
        }

        // --- SOCKET.IO EVENTS ---
        socket.on('currentPlayers', (players) => { otherPlayers = players; });
        socket.on('newPlayer', (data) => { otherPlayers[data.id] = data.player; });
        socket.on('playerMoved', (data) => {
            if (otherPlayers[data.id]) {
                otherPlayers[data.id].x = data.x;
                otherPlayers[data.id].y = data.y;
                otherPlayers[data.id].angle = data.angle;
            }
        });
        socket.on('disconnectPlayer', (id) => { delete otherPlayers[id]; });
        socket.on('bulletFired', (data) => { bullets.push(data); });

        // Xoay súng theo chuột
        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            myPlayer.angle = Math.atan2(mouseY - myPlayer.y, mouseX - myPlayer.x);
            socket.emit('playerMovement', { x: myPlayer.x, y: myPlayer.y, angle: myPlayer.angle });
        });

        // Bắn đạn khi click chuột
        window.addEventListener('click', () => {
            if (document.getElementById('select-screen').style.display === 'none') {
                const bulletData = {
                    x: myPlayer.x + Math.cos(myPlayer.angle) * 20,
                    y: myPlayer.y + Math.sin(myPlayer.angle) * 20,
                    dx: Math.cos(myPlayer.angle) * 12,
                    dy: Math.sin(myPlayer.angle) * 12
                };
                socket.emit('shoot', bulletData);
            }
        });

        // Di chuyển bằng phím
        window.addEventListener('keydown', (e) => {
            let speed = 6;
            if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') myPlayer.y -= speed;
            if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') myPlayer.y += speed;
            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') myPlayer.x -= speed;
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') myPlayer.x += speed;

            socket.emit('playerMovement', { x: myPlayer.x, y: myPlayer.y, angle: myPlayer.angle });
        });

        // Hàm vẽ khẩu súng
        function drawGun(x, y, angle) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            ctx.fillStyle = '#ccc';
            ctx.fillRect(0, -4, 20, 8); // Thân súng
            ctx.restore();
        }

        // Game Loop
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Cập nhật và vẽ đạn
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.dx;
                b.y += b.dy;

                ctx.fillStyle = '#ffeb3b';
                ctx.beginPath();
                ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
                ctx.fill();

                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                    bullets.splice(i, 1);
                }
            }

            // 2. Vẽ người chơi khác và súng của họ
            Object.keys(otherPlayers).forEach((id) => {
                let p = otherPlayers[id];
                drawGun(p.x, p.y, p.angle || 0);
                ctx.fillStyle = p.color || '#ff5722';
                ctx.beginPath();
                ctx.arc(p.x, p.y, 15, 0, Math.PI * 2);
                ctx.fill();
            });

            // 3. Vẽ bản thân và súng của mình
            drawGun(myPlayer.x, myPlayer.y, myPlayer.angle);
            ctx.fillStyle = '#4CAF50';
            ctx.beginPath();
            ctx.arc(myPlayer.x, myPlayer.y, 15, 0, Math.PI * 2);
            ctx.fill();

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
